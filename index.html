<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DexBlast Mini App</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="bg-egg"></div>

  <div class="glass-panel">
    <div class="top-bar">
      <!-- Telegram Login Widget -->
<script async src="https://telegram.org/js/telegram-widget.js?19"
        data-telegram-login="dexblast_bot"
        data-size="large"
        data-radius="8"
        data-userpic="true"
        data-request-access="write"
        data-onauth="onTelegramAuth(user)">
</script>

<script>
  function onTelegramAuth(user) {
    console.log('✅ Telegram user data:', user);

    // ارسال داده کاربر تلگرام به سرور اصلی
    fetch("https://YOUR_BACKEND_URL/api/telegram-login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        id: user.id,
        username: user.username,
        first_name: user.first_name,
        last_name: user.last_name,
        photo_url: user.photo_url,
        auth_date: user.auth_date,
        hash: user.hash
      })
    })
    .then(res => res.json())
    .then(data => {
      console.log("Server response:", data);
      // ذخیره اطلاعات کاربر در مرورگر
      localStorage.setItem("tg_user", JSON.stringify(user));
      location.reload(); // رفرش برای نمایش پروفایل
    })
    .catch(err => console.error("❌ Error sending data:", err));
  }
</script>

      <button id="theme-toggle">🌞</button>
      <button id="connect-wallet">Connect Wallet</button>
    </div>

    <div class="profile">
      <img id="profile-pic" src="https://i.ibb.co/9vZf0cW/default-avatar.png" alt="profile" />
      <h2 id="username">Guest</h2>
    </div>

    <div class="coming-soon">
      <h3>🎯 Tasks – Coming Soon</h3>
      <h3>🤝 Referrals – Coming Soon</h3>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
