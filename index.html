<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DexBlast Mini App</title>

  <!-- Telegram Mini App -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- TON Connect -->
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="bg-egg"></div>

  <main class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="dot"></span>
        <h1>DexBlast</h1>
      </div>

      <div class="actions">
        <button id="themeToggle" class="ghost-btn">🌙</button>
        <div id="ton-connect"></div>
      </div>
    </header>

    <section class="glass">
      <div class="profile">
        <img id="userPhoto" class="avatar" />
        <div class="who">
          <div id="userName" class="name">Guest</div>
          <div id="userHandle" class="handle">@guest</div>
        </div>

        <div class="wallet">
          <div class="lbl">Wallet</div>
          <div id="walletAddr" class="mono">—</div>
          <div id="walletBal" class="mono small">Balance: —</div>
        </div>
      </div>

      <div class="grid">
        <div class="card soon">
          <h3>Tasks</h3>
          <p>Coming soon…</p>
        </div>
        <div class="card soon">
          <h3>Referral</h3>
          <p>Coming soon…</p>
        </div>
      </div>
    </section>

    <footer class="foot">© DexBlast</footer>
  </main>

  <script src="main.js"></script>
</body>
</html>
