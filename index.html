<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DexBlast Mini App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">

  <!-- Telegram WebApp -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

<!-- TonConnect UI (CDN) -->
<script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>

<!-- (اختیاری برای انیمیشن‌ها) polyfill -->
<script src="https://unpkg.com/web-animations-js@latest/web-animations.min.js"></script>

  <!-- VolcEngine SDK -->
  <script type="module" src="volcConnect.js"></script>
</head>
<body>

  <div class="theme-toggle" onclick="toggleTheme()">🌙</div>

  <div class="container">
    <h2>DexBlast Mini App</h2>

    <!-- Wallet Section TON -->
    <div class="wallet-box">
      <button id="connectWalletBtn">Connect TON Wallet</button>
      <p id="walletAddress">Wallet: Not Connected</p>
      <p id="walletBalance">Balance: -- TON</p>
    </div>

    <!-- Wallet Section Volc -->
    <div class="wallet-box">
      <p>Volc Mini Wallet</p>
      <p id="volcStatus">Status: Disconnected</p>
      <button id="volcConnectBtn">Connect Volc</button>
      <button id="volcDisconnectBtn">Disconnect Volc</button>
      <button id="volcSendBtn">Send Test Message</button>
      <div id="volcMessages"></div>
    </div>

    <!-- Profile -->
    <div class="profile-box">
      <img id="userPic" src="assets/userpic.png" alt="pfp">
      <p id="userName">Telegram: Not Logged</p>
    </div>

    <!-- Level & XP -->
    <div class="level-box">
      <p>Level: <span id="userLevel">1</span></p>
      <div class="xp-bar">
        <div id="xpFill"></div>
      </div>
      <p><span id="userXP">0</span> / 500 XP</p>
    </div>

    <!-- Tasks -->
    <div class="tasks">
      <div class="task-item">
        <p>Referral Link</p>
        <button onclick="copyReferral()">Copy Link</button>
      </div>
      <div class="task-item">
        <p>Join Channel</p>
        <button onclick="checkJoin()">Verify</button>
      </div>
    </div>

  </div>

  <script src="script.js"></script>
</body>
</html>
