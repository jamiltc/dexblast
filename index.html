<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>DexBlast Mini App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/@tonconnect/ui@latest/dist/tonconnect-ui.min.js"></script>
</head>
<body>

  <!-- Splash Screen -->
  <div id="splash">
    <img src="assets/egg.gif" alt="DexBlast Egg">
    <p>Loading...</p>
  </div>

  <!-- Dark/Light Toggle -->
  <div class="theme-toggle" onclick="toggleTheme()">🌙</div>

  <!-- Connect Wallet Floating -->
  <button id="connectWalletBtn" class="floating-btn">🔗 Connect Wallet</button>

  <!-- Main Container -->
  <div id="mainContent" class="container hidden">
    <h2>DexBlast Mini App</h2>

    <!-- Telegram Profile -->
    <div class="profile-box">
      <img id="userPic" src="assets/userpic.png" alt="User Pic">
      <p id="userName">Guest</p>
    </div>

    <!-- Wallet Info -->
    <div class="wallet-box">
      <p id="walletAddress">Wallet: Not Connected</p>
      <p id="walletBalance">Balance: -- TON</p>
    </div>

    <!-- Referral -->
    <div class="referral-box">
      <p>Your Referral Link:</p>
      <input type="text" id="refLink" readonly>
      <button onclick="copyReferral()">Copy</button>
    </div>

    <!-- Refresh -->
    <div class="refresh-bar">
      <button id="refreshBtn">🔄 Refresh</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
